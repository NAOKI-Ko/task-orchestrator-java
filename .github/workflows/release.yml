name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to release
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v6
      - name: Run quality gates and build release JARs
        run: >-
          ./gradlew clean check spotbugsMain spotbugsTest jmhClasses
          jar sourcesJar javadocJar --no-daemon
      - name: Verify tag matches project version
        run: |
          if [[ "$RELEASE_TAG" != v* ]]; then
            echo "Release tag must start with v: $RELEASE_TAG" >&2
            exit 1
          fi
          project_version="$(sed -nE 's/^version = "([^"]+)"/\1/p' build.gradle.kts)"
          if [[ -z "$project_version" ]]; then
            echo "Could not read project version from build.gradle.kts" >&2
            exit 1
          fi
          if [[ "${RELEASE_TAG#v}" != "$project_version" ]]; then
            echo "Tag $RELEASE_TAG does not match project version $project_version" >&2
            exit 1
          fi
      - name: Verify release does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$RELEASE_TAG"
          build/libs/task-orchestrator-java-*.jar
          --verify-tag
          --title "$RELEASE_TAG"
          --generate-notes
